<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave a Review | Geraldine Berry Barn Bakery &amp; Cafe</title>
<meta name="description" content="Tell us how your visit to Geraldine Berry Barn Bakery & Cafe went." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%93%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--berry:#b8365a;--berry-deep:#7d1f3c;--cream:#fbf6ef;--bone:#f3e9dd;--ink:#2e2024;--ink-soft:#6a5a5f;--dark:#2a161d;--radius:18px;--shadow:0 18px 40px -18px rgba(72,20,38,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
h1,h2{font-family:'Yeseva One',serif;font-weight:400;line-height:1.1}
a{color:inherit;text-decoration:none}
.logo{font-family:'Yeseva One';font-size:1.3rem;color:#fff;margin-bottom:30px}
.logo span{color:#ffb3c6}
.card{background:var(--cream);border-radius:24px;padding:48px 40px;max-width:560px;width:100%;box-shadow:var(--shadow);animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--berry);display:block;margin-bottom:14px}
.card h1{font-size:2rem;margin-bottom:12px;color:var(--ink)}
.card p.sub{color:var(--ink-soft);margin-bottom:34px;font-size:1.05rem}
.stars-pick{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.stars-pick button{background:none;border:0;font-size:2.8rem;cursor:pointer;color:#dcc9b6;transition:transform .2s,color .2s;line-height:1}
.stars-pick button:hover{transform:scale(1.18)}
.stars-pick button.lit{color:#e8a13a}
.hint{font-size:.92rem;color:var(--ink-soft);min-height:22px;margin-bottom:10px;font-weight:600}
.back{display:inline-block;margin-top:30px;color:rgba(255,255,255,.7);font-weight:700;font-size:.92rem}
.back:hover{color:#fff}
.note{font-size:.82rem;color:var(--ink-soft);margin-top:24px}
</style>
</head>
<body>
<a href="index.html" class="logo">🍓 Geraldine <span>Berry Barn</span></a>
<div class="card">
  <span class="eyebrow">Your feedback</span>
  <h1>How was your visit?</h1>
  <p class="sub">Tap a star to let us know. It only takes a second.</p>
  <div class="stars-pick" id="stars">
    <button data-v="1" aria-label="1 star">★</button>
    <button data-v="2" aria-label="2 stars">★</button>
    <button data-v="3" aria-label="3 stars">★</button>
    <button data-v="4" aria-label="4 stars">★</button>
    <button data-v="5" aria-label="5 stars">★</button>
  </div>
  <div class="hint" id="hint">&nbsp;</div>
  <p class="note">5-star visits head to Google · anything less comes straight to us so we can put it right.</p>
</div>
<a href="index.html" class="back">← Back to the site</a>
<script>
// Replace with the real Google review link when available
const GOOGLE_REVIEW_URL="https://g.page/r/PLACEHOLDER/review";
const hints={1:"Sorry to hear that — tell us what went wrong",2:"We'd like to make it right",3:"Thanks — how can we do better?",4:"Great! Share it on Google ★",5:"Wonderful! Share the love on Google ★"};
const stars=[...document.querySelectorAll('#stars button')],hint=document.getElementById('hint');
stars.forEach(btn=>{
  const v=+btn.dataset.v;
  btn.addEventListener('mouseenter',()=>{stars.forEach(b=>b.classList.toggle('lit',+b.dataset.v<=v));hint.textContent=hints[v];});
  btn.addEventListener('click',()=>{
    if(v>=4){window.location.href=GOOGLE_REVIEW_URL;}
    else{window.location.href="private.html?rating="+v;}
  });
});
document.getElementById('stars').addEventListener('mouseleave',()=>{stars.forEach(b=>b.classList.remove('lit'));hint.textContent=' ';});
</script>
</body>
</html>
